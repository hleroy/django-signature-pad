name: Publish

on:
  push:
    tags:
      - "v*"
  # Manual retry path. A tag push runs the workflow file as it exists at the
  # tagged commit, so a CI-only fix would otherwise have to be folded into the
  # tag. Dispatching from a branch runs that branch's workflow against an
  # already-pushed tag instead, leaving the tag on the release commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.10.0"
        required: true
        type: string

jobs:
  test:
    # On dispatch this runs the caller's ref, not the tag; it is a smoke test
    # for the retry, not a substitute for the matrix that ran on the tag push.
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Build package
        run: uv build

      - name: Verify wheel is not empty
        run: |
          python3 << 'PYEOF'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("No wheel found in dist/")
          names = zipfile.ZipFile(wheels[0]).namelist()
          if "signature_pad/__init__.py" not in names:
              sys.exit(f"Wheel {wheels[0]} is missing signature_pad package code; aborting publish")
          print(f"OK: {wheels[0]} contains the signature_pad package")
          PYEOF

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 << 'PYEOF'
          import re, sys, os
          version = os.environ["VERSION"].lstrip("v")
          with open("CHANGELOG.md") as f:
              content = f.read()
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          if not match:
              print(f"Version {version} not found in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)
          with open("release_notes.md", "w") as out:
              out.write(match.group(1).strip())
          PYEOF
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}

      - name: Create GitHub Release
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --verify-tag \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
